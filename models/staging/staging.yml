version: 2

models:

  - name: stg_dn_referrals
    description: >
      Standardises the District Nursing referrals dataset.
      Cleans text fields, trims whitespace, standardises organisation
      identifiers and preserves the original grain of the source data
      ready for downstream transformations.

    columns:
      - name: org_code
        description: Three-character NHS organisation identifier.

      - name: org_name
        description: Standardised NHS organisation name.

      - name: referrals
        description: Total number of District Nursing referrals recorded.

      - name: patients
        description: Total number of unique patients referred.

# NEXT MODEL
  - name: stg_dn_age
    description: >
      Standardises the District Nursing age demographics dataset.
      Cleans text fields, trims whitespace, standardises organisation
      identifiers and preserves the original grain of the source data
      ready for downstream transformations.

    columns:
      - name: org_code
        description: Three-character NHS organisation identifier.

      - name: gender
        description: Patient gender.

      - name: age
        description: Patient age band.

      - name: total_patients
        description: Number of unique patients within each organisation, gender and age band.

# NEXT MODEL
